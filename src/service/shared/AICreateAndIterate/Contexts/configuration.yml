suggestFixPromptTemplate: |
    You are an experter in yaml, logic, and suggesting fixes. 

    Input:
      ```yaml
      {{yaml}}
      ```

    Error:
      Location: {{location}}
      Line: {{line}}
      Column: {{col}}
      Message: {{error}}

    Hints:
    {{hints}}

    Instructions:
    - Use the Hints to understand the error and the YAML content.
    - Provide a list of suggestions to fix the error in the YAML.
    - Each suggestion should be a string that is a concise fix to the error.  Where an user can say "yes" or "no" to each suggestion.
    - The suggestions should be clear and actionable, and they should not contain any logical ambiguity (i.e: no "or" statements).  If there is ambiguity, divide into multiple suggestions until it is clear and actionable. 
    - Return only the JSON array with no extra explanation.

fixSyntaxWithLLMPromptTemplate: |
  You are an expert YAML syntax fixer.
  Input YAML:
  ```yaml
  {{yaml}}
  ```
  Syntax Errors:
  {{errors}}
  Hints:
  {{hints}}
  Please use the above syntax errors and hints to correct all issues in the YAML. Output only the corrected YAML in a code block, with no extra explanation.

recommendFirstErrorPromptTemplate: |
  You are an expert YAML configuration troubleshooter. Given the following list of YAML validation errors, recommend which error should be fixed first, considering dependencies and impact.
  List of errors:
  {{errors}}

  YAML:
    {{{yaml}}}

  Explain your reasoning and return the index of the error to fix first, and a short explanation in JSON:
  {"index": number, "reason": string}

  
  Return only the JSON—no extra explanation.

humanReviewPromptTemplate: |
  You are expert YAML reviewer.  You tried to fix this following issue:
   
   
    Line: {{line}}
    Column: {{col}}
    Error: {{error}}
 
  Current YAML:
  ---
  {{yaml}}

  Fixed YAML:
  ---
  {{fixedYaml}}

  Explain the changes in the Fixed YAML that addresses the error.  Be consice and clear.  Just the summary of the changes.  Do not include any other information.

applyFixStepPrompt: |
  You are an expert YAML fixer.

  Input:
      ```yaml
      {{yaml}}
      ```

  Error:
      Location: {{location}}
      Line: {{line}}
      Column: {{col}}
      Message: {{error}}

  Hints:
    {{hints}}

  Fix request:
      {{patch}}

  

  Instructions:
  - Apply the fix only to address the specified error.
  - Preserve all original characters exactly as they appear in the input; do NOT convert characters like `>` to `&gt;` or emojis to HTML entities.
  - Output only the complete corrected YAML document, wrapped in a YAML code block (```yaml …```), with no extra explanation.
